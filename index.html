<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 9999;
        background-color: #0a0a0a;
      }
      html.light #boot-splash {
        background-color: #f5f5f5;
      }
      #boot-splash .splash-brand {
        font-family: "Syne", "Segoe UI", system-ui, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ededed;
      }
      html.light #boot-splash .splash-brand {
        color: #1a1a1a;
      }
      #boot-splash .splash-ck {
        color: #c8f135;
      }
      html.light #boot-splash .splash-ck {
        color: #8ab400;
      }
      #boot-splash .splash-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #c8f135;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      html.light #boot-splash .splash-spinner {
        border-color: rgba(0, 0, 0, 0.1);
        border-top-color: #8ab400;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ckoursePlayer-theme");
          if (stored === "dark") {
            document.documentElement.classList.remove("light");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="splash-brand"><span class="splash-ck">CK</span>OURSE</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
